- name: Keir Legree
  slug: keir-legree
  office: Council - District 3
  answers:
  - "Seattle offers an approach Portland can learn from because it treats transportation as an interconnected system rather than focusing on one mode of travel. \n\nI support that balanced approach. Portland should continue improving bicycle and pedestrian safety, but those investments should be considered alongside maintaining our streets and bridges, improving transit, reducing dangerous intersections, and keeping people and goods moving efficiently.\n\nI also believe transportation projects should be evaluated individually. A protected bike lane may be the right solution on one street, while a neighborhood greenway, safer crossing, improved signal or other design may work better somewhere else. The goal should be a safe, well-maintained transportation system that works for everyone, regardless of how they choose to get around."
  - "One project I think Portland got right is the SE Hawthorne redesign. The city chose a design that balanced pedestrian safety, transit, vehicle traffic and bicycle connectivity. The results are significant reductions in speeding, improved bus travel times and reliability, and relatively small impacts on vehicle travel times. \n\nPortland got the Barbur access to transit project wrong. Four access projects were originally planned, but because of cost overruns, two were ultimately removed from the project, while the remaining work still finished way over the original bid for four."
  - |-
    Portland is making some progress on street safety, but bicycle commuting is down and remains is below pre-pandemic levels.

    There are likely several reasons. More people are working remotely since the pandemic is certainly a big part of it. I also think we should look at whether public safety, street homelessness, and reduced activity in parts of downtown have discouraged some people from biking and walking.
  - |-
    I drive an old ’97 pickup to work. I've been remodeling my house, so the truck has been practical, and frankly, it's what I can afford right now. Around my neighborhood, I walk quite a bit, and when my wife and I go out for the evening, we use Uber.

    I sometimes ride my bike for fun along the river, but biking isn't practical for my daily commute because my work is about 30 miles away.
- name: Esther León
  slug: esther-leon
  office: Council - District 3
  answers:
  - Montréal is a city that I think Portland ought to model itself after in terms of its overall transportation policy, funding, and design scope. The amount of high quality bike and transit infrastructure being added to their network is astonishing in contrast to the comparatively glacial pace of Portland. Montréal just seems to deal with less bottlenecks, particularly around negotiating "right-of-ways," that allow stated their visions to become reality more quickly with fewer cost overruns.
  - |-
    The amount of social and economic damage that our freeways have caused makes i5 the obvious answer. As bad as i405 is in terms of slicing the city, it is at least more thoughtful in  stitching the urban fabric together through many bridges (with the new Flanders crossing being a particularly positive highlight).

    The city got the MAX Yellow Line right in its design, giving Interstate Ave. a road diet while building the transit infrastructure the corridor needed to develop high density housing. Extending the MAX into Vancouver would allow the Yellow Line to live up to its full potential.
  - "I think we have unfortunately fallen far behind on this. Portland used to lead with bold vision, yet we now seem to be stuck in a malaise. Part of this is cultural, with gentrification and COVID leading to an increase in driving culture, while the other is political will. Sadly, the City of Portland seems resigned to decline rather than seizing it as a motivating call to action. \n\nWhile I think PBOT generally does a solid job when it actually builds bike and pedestrian infrastructure, the implementation is too slow and doesn't seem to follow a strong, cohesive vision. Our bike network is still too fragmented and piecemeal. A good example of this would be the bikeway on Washington starting at 76th Ave and going up to 82nd. It starts off as solid infrastructure and then suddenly drops off. It makes me wonder who would actually use it when it feels like more of a demo of an idea rather than something applicable to someone's day-to-day reality. You can find examples like this all over the city, great ideas that unfortunately manifest as half-measures in their implementation. We have incredibly talented people at PBOT that unfortunately seem held back by a lack of political will to do the bold thing. The current City Council has a role in this too, with little in the way of bike legislation passed or even proposed since they took the oath in 2025. \n\nIt would be easy for the Council to say, \"we just don't have the money,\" but I think it is more of a limitation of imagination than anything else. Look at \"Better Naito\" as an example and what Better Block was able to accomplish in 2015. What started off as safety cones eventually became solid infrastructure. We can implement pilot projects all over the city to demonstrate their value with little to no expense. We can alleviate the fears of drivers by pointing to a project's temporary \"pilot\" status while tracking 'real-world' (rather than theoretical) traffic data."
  - I bike, walk, use transit, and drive. My jobs (I work in both Wilsonville and Gresham while living in the Brooklyn neighborhood of District 3) make it difficult not to drive for work, but I do my best to never default to driving in my day-to-day. I am always prioritizing biking or transit whenever possible. My experience informs me of just how much our regional transit network falls short of being able to connect people effectively to job centers outside of driving.
- name: Steve Novick
  slug: steve-novick
  office: Council - District 3
  answers:
  - I have been to Copenhagen to see their bike lane network (It was a boondoggle financed by Big Bicycle!), but I’d look to cities that have had recent surges in bicycling, such as Paris and New York. Paris has invested heavily in protected bike lanes and established car-free zones. I know New York has invested in bike lanes too, but my impression from articles I have read is that their “bike boom” has been greater than one would expect from the bike lane investment alone. I’m interested in learning more. I suspect that one thing that helps fuel the New York bicycling boom is that there are factors other than bike lanes that make both biking and walking safer than it is here, and one possible factor is that New York has 3,000 speed and red light cameras.
  - "A project that Portland is getting right is the 82nd Avenue improvements currently under construction. Trimet’s line 72 bus line is the busiest in the city, and it serves a very diverse community including working people, students, and families. The sidewalks and other improvements along 82nd will make the street safer for everyone, but especially for pedestrians and cyclists. And investing in bus rapid transit will make transit a much more realistic choice for the people who are living and working along 82nd. I joined others in successfully pushing the Portland Clean Energy Fund (PCEF) to invest in the bus rapid transit investments on 82nd.  I think this investment is a model for how PCEF should be investing in transportation, and as we move into the next 5-year PCEF spending plan over the next couple of years, I’ll be advocating for PCEF to invest much more in transportation to meet our climate goals as well as the needs of PCEF priority populations.\n\nI think Portland’s main failing in transportation has more to do with neglect than with individual projects. For decades, leadership in this city neglected our streets, and that shows in terms of the poor condition of our pavement and the high number of unsafe intersections.  I think a big part of the reason for these failures lies with the commission form of government, which created silos rather than requiring city leaders to see the whole. The new Transportation Utility Fee led and passed by Councilor Clark in our new form of government will help to address the backlog of safety projects and prevent our major streets from going back to gravel – but we have a long way to go. \n\nOne specific thing I think Portland got wrong was allowing the original streetcar lines to die. I know it would have been fighting against  the trend, but I wish leaders had found some way to preserve them."
  - "The 2025 Bicycle Count report from the Portland Bureau of Transportation found that the number of people biking remained steady for the second year in a row (see https://www.portland.gov/transportation/walking-biking-transit-safety/bicycle-counts and https://bikeportland.org/2026/04/10/city-reports-steady-not-stagnant-bicycle-use-in-2025-count-report-399860). But before that, we had years of declining numbers. \n\nI think a number of factors have driven declining and now steady numbers. The COVID pandemic really changed where and when people work, and many people who used to commute by bike are probably working remotely without any commute at all. Or, people who work hybrid schedules may only commute two or three days/week rather than five. And along with these different work schedules may come more complicated and less repetitive trip patterns that combine different patterns of errands and travel on different days, disrupting bicycling efforts. (At the same time, it makes sense to me that COVID may have increased recreational cycling, but this perhaps doesn’t translate into the same number of trips as bike commuting.) Infrastructure is also part of the problem - there are places in the city that lack basic infrastructure that makes bicycling easier and safer. However, it doesn’t really make sense that we have continued to make improvements in bicycling infrastructure while seeing a reduction in mode share from ten years ago. \n\nI think one important factor is making the streets safer and thus more welcoming to people who want to ride bikes but are afraid to. I am proud that the Fixing Our Streets gas tax that I championed has helped strengthen Safe Routes to School and made a lot of specific intersections safer. But my impression is that driver behavior got worse during the pandemic and has not improved. One enforcement strategy we have to use more is red light and speed cameras – and one city that performs better than Portland on traffic fatality rates is New York City, which has ⅓ of the fatalities per capita that we do. There are a variety of reasons for that - but one important factor is that they have 3,000 speed and red light cameras, and we have something like 40, even though we have a third of the lane miles as New York City. I am constantly nagging PBOT about whether we can increase the number of speed and red light cameras that we have. PBOT hopes that with their new, hopefully more competent and efficient, contractor, it might be possible to add more cameras without costing the city any additional money. The courts are another possible barrier since they process the tickets given by cameras, and need the resources to do so, but I’ve talked to the Multnomah County court administrator and she thinks the Legislature should be willing to provide the courts with the staff needed for additional cameras. I need to check in with PBOT to see if we are in a position where we have a basis for asking the next Legislature for those resources. In fact I’ll send that email right now. \n\nI’d note that I asked a similar question at a Bike Happy Hour in 2024, and I was really impressed by the thoughtful responses from BikePortland readers in the comment section of the article: https://bikeportland.org/2024/10/17/council-candidate-steve-novick-has-some-questions-for-the-bike-community-390690\n\nAs you know, Roger Geller thinks that part of our problem has been that bicycling has just kind of dropped out of the public discourse from where we were 10 years ago. I want to try Roger’’s multi-pronged proposal to restore mode share, including an organized framework of rides. \nhttps://bikeportland.org/2024/11/15/roger-geller-has-a-plan-to-spur-portlands-cycling-renaissance-391332"
  - "I take the MAX Orange Line downtown to City Hall whenever I can. This last week I rode it – two days? Three days? One of those two, I think. This is the first time in a life that has included lots of transit use (the #45 bus from Multnomah Village to City Hall during my 2013-16 term, the subway in D.C. and before than in NYC) that I have done the “park and ride” thing; I live in the southern end of the Woodstock neighborhood, and I park at the SE Tacoma/Johnson Creek station. I love taking the Max because I get some time on the train to check email and think – and I don’t have to pay for parking downtown. But depending on what’s happening in any given week I sometimes or often drive my car downtown. This is mainly due to schedule constraints or commitments that require getting somewhere else that isn’t easily accessible by transit. As a City Councilor I often don’t have a lot of control over my schedule, and sometimes that drives me to drive. \n\nWhen I’m not commuting, I usually drive. That’s partly because for the first time in my adult life I don’t live within easy walking distance of restaurants and grocery stores. I needed a 1-story place with a yard, or access to one, for my corgi Barley - corgis really shouldn’t climb stairs much - and the only place I could find was a mile south of the Woodstock town center. \n\nI don’t ride a bike myself. I tried learning when I was a kid, kept falling off, and gave up. I’d try to learn now but I am worried that if I fell and injured my right arm I would be totally incapacitated. But I am deeply committed to making it more possible for anyone who can ride to do so. The 2024 BikePortland article I referenced earlier includes a concise summary of some of my proudest pro-biking and pro-walking accomplishments from my term as City Commissioner (2013-2016): https://bikeportland.org/2024/10/17/council-candidate-steve-novick-has-some-questions-for-the-bike-community-390690. When I led the coalition to pass a ten cent gas tax to invest in transportation maintenance and safety, led the launch of Biketown, and supported the Better Naito project, I did so because biking is good for everyone. The individual cyclist gets exercise and saves money, and sometimes avoids getting stuck in traffic. We all benefit because there are fewer cars on the streets creating traffic, and our carbon emissions are lower. And bicyclists, by being healthier, drive down premium costs for anyone in the same health insurance network!"
- name: Cristal Otero
  slug: cristal-otero
  office: Council - District 3
  answers:
  - |-
    Seville, Spain. What stands out to me is not simply that Seville built good bicycle infrastructure, but that it treated a connected network as something to complete. The city built an initial 80-kilometer network in about two years and expanded it to 120 kilometers within four years. Cycling went from roughly 0.5% to 6% of trips between 2007 and 2011.

    Portland already has an ambitious vision. The Bicycle Plan for 2030 calls for a 962-mile “World-Class” network, and Portland has made substantial progress. But the city’s most recent comprehensive progress report found that only 28% of the full World-Class Network was complete or funded at that time.

    I think the lesson from Seville is to turn that remaining vision into a completion program: identify the critical missing links and dangerous intersections, establish a realistic timeline, dedicate multi-year funding, and incorporate those improvements whenever streets are paved or reconstructed. A world-class network should mean that someone can travel on a low-stress route across Portland without the safe infrastructure disappearing when they reach a major arterial or intersection. Portland does not need another bicycle vision. We need to finish the ambitious one we already adopted.
  - |-
    One project I think Portland is getting right is 82nd Avenue. Taking ownership of 82nd from the state and committing substantial investment to safety, paving, crossings, accessibility, transit access and the public realm matters not only because the corridor needed repair, but because it is a question of geographic equity. East Portland has historically had fewer complete streets and has experienced some of the city’s highest traffic-safety risks. We should be willing to put major capital investment into parts of Portland that went too long without the basic infrastructure other neighborhoods take for granted.

    Powell Boulevard represents what we got wrong. For decades we allowed a state highway to function as a major neighborhood street while many parts of the corridor lacked basic pedestrian and bicycle infrastructure. Important improvements are now underway, particularly on Outer Powell, but residents should not have had to wait this long for sidewalks, safe crossings and protected bicycle facilities.

    To me, the lesson from 82nd and Powell is that transportation equity is geographic. A person’s ability to walk, bike, take transit or simply cross the street safely should not depend on which part of Portland they live in. I want us to invest in the places where the gaps and safety risks are greatest, rather than continuing to reproduce the uneven infrastructure patterns we inherited.
  - |-
    I think the trajectory is mixed. Portland continues to build safer bicycle and pedestrian infrastructure, and recent traffic-safety data are encouraging, but one of the key performance indicators has to be whether more people are actually walking and biking.

    On bicycling, we have not yet reversed the decline. Portland’s bicycle counts rose through the mid-2010s, declined substantially afterward, and have only recently begun to stabilize. At locations counted in both 2024 and 2025, bicycle volumes increased just 1%. That is better than continued decline, but it is not yet the growth we need.

    I think that matters because infrastructure mileage alone cannot be our measure of success. Portland’s own Bicycle Plan treats bicycle mode share, network completion, connectivity, safety, and access to low-stress routes as performance measures. We should be asking not only “how many miles did we build?” but “did more people use the system, did they feel safe using it, and can they actually reach everyday destinations?”

    I think the current trajectory reflects several things: remote work changed commute patterns, but the decline in bicycling began before the pandemic; parts of the network are still disconnected or stressful; and cost and availability have affected BIKETOWN. Portland has made substantial infrastructure investments, but we have not yet translated those investments into sustained ridership growth.

    For me, the next phase is about outcomes. Complete the low-stress network, maintain it well, make it useful for ordinary trips, and then measure whether more Portlanders are actually choosing to walk and bike.
  - |-
    I use a mix of transit, walking, biking, and driving. I usually take the bus or MAX to work, and I genuinely enjoy it—I find transit relaxing and a good way to decompress. I also walk almost every day to do errands around my neighborhood, usually with my dog.

    I used to bike much more regularly. After 2020, I worked from home for about four years, my commute disappeared, and my bike gradually fell into disrepair. I have not fully rebuilt that habit yet.

    The biking infrastructure around my home is actually pretty good. I live close to the Springwater Corridor, MAX, and neighborhood greenways, so I can bike locally or bring my bike onto transit pretty easily. The trips I still rely most on a car for are trips to Vancouver to help care for my mom.

    For me, the biggest barrier to biking more right now is honestly just getting my bike back into working order and rebuilding the habit.
- name: Tom Sollitt
  slug: tom-sollitt
  office: Council - District 3
  answers:
  - Barcelona. Portland could learn from Barcelona’s superblock model of using street hierarchy, traffic diversion, and speed management to reduce through-traffic on neighborhood streets while maintaining access for residents, deliveries, emergency services, and transit. I would adapt that incrementally through Portland’s neighborhood greenways and Metro’s Community Quick-Build Guide, using diverters, chicanes, curb extensions, safer crossings, and other low-cost treatments. With budget constraints, I would pursue coordinated funding through Metro, TriMet, Multnomah County and the State and empower neighborhood associations to help identify and support projects. Projects should be evaluated using speed, crash, traffic-volume, and mode-share data before scaling.
  - |-
    I think Portland got the NE Glisan Paving and Safety Project right because it combines paving, ADA improvements, safer crossings, a neighborhood greenway crossing, and buffered bike lanes into one project. With transportation dollars getting tighter, this is the kind of approach I want to see more of. When we are already investing in a street, we should look for opportunities to address multiple safety and mobility needs at the same time.

    I think we got the NE Broadway Pave & Paint project wrong. Delivery and service vehicles routinely stop in the bike lane, forcing people biking around them and into traffic. That defeats the purpose of having a dedicated lane. We need to think about bike lanes, parking, loading and enforcement together when we design these projects.
  - We are not doing enough to make Portland’s streets safe, and that needs to remain the starting point for Vision Zero. Recent deaths have reinforced the need to focus on the conditions that make streets dangerous, particularly for people walking and biking. The City has made meaningful investments in traffic calming, safer crossings, speed management and bike buses, but we need to turn those efforts into a connected system that prevents serious crashes. We also need better ways to measure how people are traveling as trips have become more distributed since COVID. I want to focus limited resources on the High Crash Network, measure whether projects actually reduce speeds and crashes, and build on what works.
  - I live in the inner Eastside, close to most of what I need day-to-day, so I usually walk first when a trip is practical. I ride my bike several times a week when the distance makes sense, and use the bus and MAX as well. My last transit trip was taking the MAX from Hollywood to the Lloyd District during an Oregon Walks Promenade walk from the Grotto toward downtown. I had detoured for a political town hall and used the MAX to catch back up with the group before walking home. I tend to use transit as a last resort because irregular service means I have to strategically time my trips. I prefer biking when I can because I can leave when I want. I also recognize that my ability to rely primarily on walking is not an option for many Portlanders, which is why reliable transit and safe, convenient alternatives to driving matter.
- name: Kellie Torres
  slug: kellie-torres
  office: Council - District 3
  answers:
  - |-
    New York City has made significant progress by giving people more practical options for getting around without a car. Portland is obviously a different city, but we can learn from its investments in protected bike infrastructure, safer intersections, pedestrian improvements, and transit priority.

    Portland already has a strong foundation for biking, but too many routes are disconnected or become uncomfortable at exactly the places where people need protection most. We should prioritize closing those gaps, building protected infrastructure on major corridors, improving neighborhood greenways, and creating safe connections to schools, businesses, parks, and transit. We also need to make sure our transportation funding reflects the goals we’ve already adopted. If we want more Portlanders to bike, it needs to be a safe, convenient and realistic option for everyday trips.
  - |-
    Portland got the Blumenauer Bridge right. It created a dedicated connection for people walking and biking across I-84 and closed a major gap in the central city transportation network. Projects like that demonstrate how infrastructure can make biking and walking safer and more practical.

    Where Portland has fallen short is on 82nd Avenue. For too long, one of Portland’s most important corridors was also one of its most dangerous. I’m encouraged that the City has taken ownership of 82nd and is now making significant safety investments there, but Portlanders shouldn’t have to wait decades for safer crossings, sidewalks and bicycle connections on streets where we know people are being seriously injured or killed.
  - |-
    We’re making progress on street safety, but we aren’t making enough progress on getting more people to bike. Traffic deaths declined from 69 in 2023 to 56 in 2024 and 39 in 2025, which is encouraging. But bicycle counts remained essentially flat last year, increasing just 1% at locations counted in both 2024 and 2025.

    Portland has set a goal of having 25% of trips made by bicycle by 2030, and we are clearly not on track to meet it. I think one reason is that our bicycle network still has too many gaps. A protected bike lane is only as useful as the connections on either end of it. If we want more Portlanders to choose biking, particularly people who aren’t already confident cyclists, we need connected routes, safer intersections and crossings, and infrastructure that makes biking a practical and comfortable choice from the beginning of a trip to the end.
  - |-
    I primarily drive to work at City Hall, walk for many trips in my neighborhood, and use TriMet when it works for my schedule and destination. My most recent transit trip was a couple of weeks ago to run errands before meeting with my campaign team.

    For me, the biggest factors are time, convenience, and having a safe and practical route to where I’m going. If we want more Portlanders to bike, walk, or take transit, those options need to work for people’s everyday lives. That means reliable transit and safe, connected routes that make it easier to choose something other than driving.
