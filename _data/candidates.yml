  - i usually walk on water. i haven't been on on public transit or bike in a while which is sad. i got a car so it made me lazy, i also have health issues so its not as fun, if i had a wife she might be able to convince me to go biking. i plan on making trimet free, so that will help people use it more maybe a little, tourists and elderly will be to use it more, its always the worst as tourist getting off a plane and then having to figure out how to pay for a train ticket, like stepping in dog shit when you just got a new pair of nikes
