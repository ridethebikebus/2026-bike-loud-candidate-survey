  - venice, they have rivers through all their streets, i think we should start building rivers through our city all the way from like the sandy river and just have water roads to the willamete that would be awesome, everyone get around by jet ski
  - i feel like the light rail is built to close too freeways in some places makes it difficult to expand lanes, i feel like if we built on top of the freight train on i-84.
