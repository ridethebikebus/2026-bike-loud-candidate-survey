---
- name: Ali Beaudoin
  slug: ali-beaudoin
  office: Council - District 3
  answers:
  - "Portland should focus on building a transportation system that is reliable, affordable, and practical for how people move around the city. We have invested heavily in transportation, but residents still experience poor road conditions, unreliable transit, congestion, and gaps in pedestrian and bicycle infrastructure. One example is our system was built with a focus of moving folks to downtown and as our economy has shifted, we need to change the pattern of moving people around. \n\nMy approach would start with maintenance and accountability. Before committing to expensive new projects, the City should establish clear priorities for maintaining roads, bridges, sidewalks, traffic signals, and existing transit infrastructure. Every major transportation investment should have a transparent budget, timeline, measurable outcomes, and regular public reporting.\n\nFor pedestrians and cyclists, we should continue investing in safe connections between neighborhoods, schools, business districts, and transit, with particular attention to areas that currently lack basic infrastructure. Transportation design should reflect the needs of the specific neighborhood and corridor rather than applying the same solution everywhere.\nFinally, transportation policy should be connected to housing and economic development. New housing, small businesses, schools, and employment centers need reliable transportation access. We should use transportation investments to strengthen neighborhood business districts and make it easier for residents to reach jobs and essential services."
  - |-
    One project I think Portland got right is the 70s Greenway: Cully Connector. The project is creating a safer connection through Cully and Roseway, with new sidewalks and bicycle facilities, safer crossings, traffic calming, and connections to neighborhood schools, parks, and businesses. It is also being coordinated with the larger Cully Public Works project so that the neighborhood can address multiple infrastructure needs at the same time.

    I like this approach because it focuses on practical neighborhood improvements rather than one large transportation project. It addresses basic infrastructure, pedestrian safety, biking, traffic speeds, and access to local destinations at the same time. Importantly, the Cully project also prioritizes streets based on factors such as equity and connections to parks, schools, and transit.
  - |-
    I would challenge the premise that Portland is making enough progress in getting people to bike and walk. We have made some meaningful improvements to street safety, but we have not done enough to get more Portlanders choosing to bike or walk for everyday trips.
    Portland's own 2025 bicycle count found that the number of people biking remained essentially flat for the second consecutive year. BIKETOWN ridership also declined in 2025, despite the expansion of the e-bike fleet. That tells me that simply building more bike infrastructure does not automatically mean more people will use it.

    I do think there are examples where Portland's street redesigns are making a measurable difference. For example, the SE Hawthorne improvements reduced speeding, improved bus travel times, and created better conditions for people walking and biking. The city has also reported meaningful safety improvements on several high-crash corridors.

    The bigger question is why aren't more people choosing these modes? I think convenience, safety, connectivity, and reliability all matter. A bike lane that ends unexpectedly, a dangerous intersection, poor lighting, or a long gap between safe crossings can make an entire trip feel inaccessible. Walking has a similar challenge: Portland needs more continuous sidewalks, safer crossings, better lighting, and better connections between neighborhoods, transit, schools, and business districts.

    I would focus less on simply counting how many miles of bike lanes we build and more on whether people are actually changing how they travel. We should set measurable goals for walking, biking, and transit use, track them by neighborhood, and invest where the infrastructure is most likely to change behavior.

    Portland should absolutely continue making streets safer, but the goal should be bigger than infrastructure. We need to make walking and biking safe, convenient, and practical enough that more people actually choose them.
  - |-
    Day to day, I use a mix of walking, transit, and driving depending on what I need to accomplish.

    I live in Montavilla, so I walk quite a bit within my neighborhood to local businesses, meetings, and other nearby activities. I also take the bus, including for trips into other parts of Portland. In fact, I’m taking the bus today.

    For errands that take me outside my neighborhood, particularly grocery shopping and other tasks where I need to carry things or make multiple stops, I generally drive. That is the reality for many Portlanders: our transportation choices depend on where we are going, how much time we have, what we are carrying, and whether there is a convenient alternative.

    My most recent transit trip was a bus trip, and I would like to see transit become a more practical option for more of my daily trips. The biggest barriers are reliability, travel time, and convenience. If taking transit requires significantly more time or multiple transfers compared with driving, people are going to choose their car.
    I also think Portland should focus on making walking and biking
     more useful for everyday trips not just recreational trips.
- name: Joel Corcoran
  slug: joel-corcoran
  office: Council - District 3
  answers:
  - "Denmark and Amsterdam are international cities that provide great models for Portland to learn from, but within the United States, I would look to Chicago. The City of Chicago is now seeing the benefits of its Building a New Chicago program started in 2012, a focused, strategic initiative that coupled improving transportation infrastructure, expanding parks and recreation, and improving water, sewer, and other public works infrastructure together. \n\nAll three cities demonstrate that the most effective way for cities to improve transportation over the long term is through a balanced, strategic approach that rests on four core pillars: improving public transit; enhancing active mobility and pedestrian infrastructure equitably; providing an integrated, seamless experience for users across transportation modes; and environmental protections and sustainability.\n\nIn Chicago especially, the city has spent the past decade modernizing the Chicago Transit Authority and expanding services; improving and resurfacing over two thousand miles of sidewalks (while replacing hundreds of miles of water and sewer lines at the same time); and adding over 200 miles of bike lanes (esp. protected and buffered bike lanes) and several thousand bike racks. This effort has revitalized the city and completely transformed its waterfront. \n\nI think Portland could learn quite a bit from such an integrated approach."
  - |-
    Portland certainly got the Frequent Express (FX) bus line on Division right. While not quite the bus rapid transit system we need, it has proven to be a good model for similar blended bus routes across the city.

    The Springwater Corridor continues to be a struggling boondoggle of a project. I think it represents one of those transportation projects that had (and still has) great goals, but poor planning. We failed to plan for human impacts and worst case scenarios. But I still haven’t given up on the idea of continuing to improve the Corridor, and I think the problems still plaguing it can be fixed.
  - |-
    Portland has made modest progress on street safety, but we need more convincing progress on getting more people biking and walking.

    I’m encouraged that traffic deaths fell from 69 in 2023 to 39 in 2025. This is a significant improvement, and the people doing safety work deserve credit. But 39 deaths are still 39 too many, and more than half of the people killed in 2025 were pedestrians. Meanwhile, the city’s bicycle counts were essentially flat for a second year. I would not call that the growth Portland says it wants.

    The trajectories we’re seeing represent both piecemeal success and systemic inertia. Safer crossings, lower speeds, and better bikeways help. But a person deciding whether to bike or walk a routine trip experiences the whole route: the uncomfortable crossing, the gap in a bike lane, the missing sidewalk, or the facility that is poorly maintained. One good project cannot overcome several places along the trip that feel unsafe.

    If elected, I would do everything I could to help Councilors Loretta Smith and Mitch Green obtain funding for their Sidewalk Improvement and Paving Program (SIPP) initiative and push it through to the success it deserves. SIPP is one of the few, comprehensive transportation-related strategies that the “new” City Council worked on, but it has stalled out for too long.
  - |-
    I usually walk or take the bus when commuting downtown or running errands, but I also drive quite a bit (a Hyundai Ioniq 5 EV that I’ve grown to love). I take care of my mom, and since she stopped driving a few years ago, I chauffeur her around to wherever she needs to go.

    I would like to get back to biking and skateboarding more often, but I still need to get in better shape for that.
- name: Patrick Hilton
  slug: patrick-hilton
  office: Council - District 3
  answers:
  - |-
    It’s been said many times over the years, but I think Amsterdam, Netherlands, is a great city for Portland to learn from when it comes to transportation. Portland has already adopted many of the ideas that have made Amsterdam successful, including prioritizing designing streets for safe bicycle travel and creating connected bike networks that can make biking just as fast, or even faster than driving.

    I think we should continue investing in infrastructure that separates bicycle traffic from cars on busy streets, while also creating more bike and pedestrian only streets. Hopefully, someday, we can even create entire bike and pedestrian only districts. I believe these investments can help make biking and walking the preferred options for more people making local trips.
  - |-
    I think Tilikum Crossing was a bold project that Portland got right. It’s a beautiful design, and when you’re riding or walking across it, you really notice how quiet and peaceful a bridge can be without cars.

    I think the riverside path on the west side of the river, south of downtown, could have been better. Don’t get me wrong, I’m glad it’s there, but it doesn’t have a natural flow and has too many twists and turns, which makes it less enjoyable for biking. It also doesn’t seem very well integrated into the neighborhoods it runs alongside.

    I think a great trail system should safely bring you into the surrounding neighborhoods so you can discover them and comfortably ride through them as well. This path often feels like you’re being forced to stay on it because getting off the trail and into the surrounding neighborhoods isn’t convenient or intuitive.
  - "No. I think we are regressing, continuing a sad trend that I’ve watched unfold over the past 10 years. When I moved to Portland, I was so excited to live in a city that took biking seriously as a mode of transportation. Seeing all the bikes parked outside the bars on a Saturday night was such a thrill. I bought a bike and went without a car for more than 10 years. I was committed to it. \n\nI think some of that came from the nostalgic feelings I had about biking as a child. I was a kid in the 1980s and ’90s, and biking was how I got around and experienced freedom. I explored everywhere on my bike, even though there was virtually no biking infrastructure where I grew up, and no adult told me I couldn’t.\n\nI worry that the younger generations haven’t always had that same experience. Between more protective parenting, social media, and changing childhood habits, many kids that are now adults may never have experienced a bicycle as a real form of transportation and independence. If you don’t grow up with that experience, getting on a bike as an adult may not have the same appeal or spark the same sense of joy and freedom that it did for me.\n\nI also think the smartphone era has made biking feel more precarious. I don’t ride nearly as much as I once did because I’m increasingly concerned about distracted drivers not seeing me. That’s an unfortunate trend that even great bike infrastructure may not be able to fully address.\n\nInfrastructure is important, but so is rebuilding a culture around biking. Encouraging children to start biking when they’re young, giving them the freedom to ride independently and explore their world on their terms, and supporting biking as a family activity could help make bicycles an important part of daily life in Portland again, not just as recreation, but as transportation and a healthy source of independence and freedom."
  - |-
    I used to ride my bike almost exclusively until I injured my foot in 2017. I couldn’t walk for a few months, and afterward I stopped riding because I was afraid of re-injuring it. Before that, I rode my bike from Kerns to my job in Lake Oswego every day! Eventually, I got a car, and since then biking has become mostly a recreational activity for me.

    Today, I commute by car, although I’ve been saying for the past year that I’m going to start biking to work again. I only work about five miles from home. The problem is that I’ve gotten used to the convenience of driving and being able to get places more quickly. I’m also still fearful of distracted drivers on their phones.

    Another factor is that I see so few people riding bikes on many streets now that I worry drivers are less accustomed to looking out for them than they were years ago, when cyclists seemed to be everywhere. I’m also more hesitant to lock my bike outside a business when mine is the only bike there.

     I need to get over some of these fears and start riding again. I know I won’t regret it. In fact, this Q&A might have been just the push I needed to get back on the road.
- name: Tiffany Koyama Lane
  slug: tiffany-koyama-lane
  office: Council - District 3
  answers:
  - "It’s difficult to overstate how transformative Paris’ transportation policies have been over the past decade. Paris has redefined “livability” in its city, not by the convenience of a car commute, but rather by public health, street vibrancy, and advancing its pollution reduction and climate action goals.\n\nInstead of widening car infrastructure without any hope of being able to pay for its ongoing maintenance, Paris has planted street trees and developed local pocket parks. Instead of being satisfied with peek-a-boo bike lanes, Paris has invested in protected cycling infrastructure. Political leaders have withstood the backlash from business groups and local drivers, and it has paid off. As reported by NPR after Paris’ spring 2025 elections, “...66% of Parisians voted to convert 500 more streets into pedestrian zones, marking one of the biggest shifts in how the city moves.” \n\nMany other cities have success stories to share, but few cities have, within the last decade, demonstrated the level of commitment and political courage that has resulted in such a significant transformation."
  - |-
    Right: For decades, 82nd Avenue has been one of the most dangerous corridors within Portland’s borders, and this was primarily because the legacy highway was on the wrong agency’s list of assets. Given that 82nd Avenue is the host of the most-used bus line in the State of Oregon, it makes sense to shift from a car-centric corridor to a transit-first corridor. There is a lot of work yet to be done to make this corridor everything that it can be; but every median, every street tree that is placed along 82nd Ave is a step in the right direction.

    Wrong: Free parking.
  - One of my signature pieces of legislation from my short first term was recommitting the city to ending traffic deaths and serious injuries on our streets, after years of rising, senseless deaths. This process, which I was able to organize as a unanimous vote, secured significant administrative and fiscal resources for street design improvements and safety measures. I also was able to direct the implementation of some nimble, low-cost safety measures like curb daylighting and ending right turns on red at our most dangerous intersections. I can say that at the city level there is progress, but it’s not enough and the work is not done. Just this week I spoke to the mother of a middle school student who was struck and injured on her bike by a driver making a turn at a low-visibility intersection. We have continued to see traffic fatalities, including in my district. I am confident that the trajectory is changing, but this is not an issue when you can say it’s “good enough,” when people are still being hurt and killed on our streets.
  - I ride the 14 bus to and from work multiple times a week. I ride my bike to get around the neighborhood with my kids, and I am lucky to live in a neighborhood where I can easily walk to the grocery store, library, and other essential places. My boys ride their bikes to and from school, and I want more kids to be able to do that. And honestly, I want to feel more secure about how safe they are while they are making that short trip.
