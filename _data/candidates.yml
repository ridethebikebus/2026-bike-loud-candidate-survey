  - I think the for all the good for our transit, the fact we had to make a lot of cuts because of how separated the transit systems and the city were were just means people are going to be using their cars more to get around. I would call that what we got wrong. I would say one they could do is bring back fareless square so people can go downtown easier and get back
  - No. Currently I would say for crash deaths we are going to match or have more then last year, on top of of response times being stretched for emergency response, we make it difficult for victims to get help in a timely manner and until we can do that we will continue to have problems. We need to make it clear if you drive you need to be aware in the city limits.
