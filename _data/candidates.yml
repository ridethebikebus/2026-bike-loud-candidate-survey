- name: Olivia N Clark
  slug: olivia-n-clark
  office: Council - District 4
  answers:
  - Post pandemic with work patterns changing, I’m not sure if there is one city we can emulate but I’m open to learning more from advocates and experts. There are specific policies here and there that we should consider such as congestion pricing and alternative ways to fund transit.   We are already closing and repurposing streets.  We were once a leader in alternative modes  for cities our size with bike routes and  a radial transit system (most routes going into Portland); we need to re-evaluate and update  these policies as well as transit finance.  Last I heard, we are at a 2% bike mode split and need to focus on how we re-invigorate bike travel.
  - Having raised funds for light rail and obtained funding for the Tilikum bridge, I feel we did the right thing there.  The Tilikum was the first of its kind with no cars (but access for emergency vehicles when necessary).  The wrong idea was the Westside by-pass which we killed but may re-surface.  I’d like to explore the idea of an elevated transit/freight corridor from the end of the Green line over to the Red/Blue line to avoid Clackamas County residents having to go through downtown Portland to get to jobs in Washington County.  There are current transportation assets that were ok for their day (farm to market roads) that need to be reassessed.
  - It is primarily through grassroots, citizen action (like Bike Loud, Safe Routes to Schools  or Oregon Walks) that we will encourage biking and walking.  Since the pandemic and the loss of a better funded traffic division in the Police Bureau, we have created a lot of driving scofflaws that continue to speed and make the streets unsafe.  We need more actions like citizens holding up signs in dangerous corridors during commute hours accompanied by police bureau traffic stings (which I’ve found immensely satisfying)!
  - I primarily drive due to my tightly packed schedule throughout D4.  I rode my bike in the recent Sunday Parkways in downtown and ride mostly for pleasure.  I can take the bus and streetcar when I don’t have many weekday meetings;  on the weekends I take transit with my family shopping or to downtown events.
- name: Jamey Evenstar
  slug: jamey-evenstar
  office: Council - District 4
  answers:
  - Portland should get serious about moving toward a transportation system that does not automatically build car-focused roads as the venue for sharing public space with cyclists and pedestrians. Cities like Barcelona have used superblocks to route through-traffic to the perimeter and reclaim interior streets as plazas and slow local space. Filtered permeability, using modal filters so bikes and pedestrians pass through but cars take the long way around, does something similar at a smaller, cheaper scale. We should learn where in Portland's complete neighborhoods this could work, particularly in areas we're upzoning, so density and street design are being planned together rather than treating the road network as fixed.
  - As the lead developer of the Rose Lane Project, I think that is one we got right. We used a root cause analysis to demonstrate that Black commuters spend an annual average of a week longer in traffic than the average white commuter so we built the citywide plan to address that instead of using traffic patterns and traffic congestion data to determine which bus lines to prioritize. The transportation project I think PBOT got wrong is the bike lane on Williams Ave. I believe it contributed to the gentrification of the neighborhood. I know this is controversial, but when I worked in PBOT, I created an anti-displacement toolkit for planning and the bike lane in Williams fits into the category of projects that are on the higher end of the risk scale because it was built for outsiders to move through the neighborhood instead of being built for people who live within the neighborhood to connect to their resources of health, wealth, and education.
  - I'll speak to biking specifically since I am not sure about walking and streets. The number of Portlanders riding bikes is mostly flat. I attribute that to our current bike plan that prioritizes the bike commuter who travels along an interconnected cross-city system. That leaves out the vast majority of people like me who are middle aged out-of-shape parents who just want to get to the local taquería. It also presumes that people who bike will choose that mode for every distance, but we can do a much better job of connecting bike infrastructure to transit infrastructure. So we should redesign the plan so it connects people within their own neighborhoods to their own local resources and so that it helps solve the first mile, last mile problem for transit.
  - I have been a car-free transit rider for the last nine years. I take the bus and train everywhere I go, every single day. I would like to get on a bike more, but I am a little intimidated, tbh. Would love a bike buddy!
- name: Mitch Green
  slug: mitch-green
  office: Council - District 4
  answers:
  - "Portland can learn from New York City, its DOT and the MTA’s Central Business District congestion pricing program that launched in January 2025. This program has demonstrated the kind of transformation that’s possible when a good policy is studied for years reaches implementation and is allowed to flourish when leaders are committed to its success rather than abandoning it after some criticism. NYC’s congestion pricing program is the first of its kind in the nation, generating $50 million in its first month and more than $550 million net revenue in its first year. Its also fighting off President Donald Trump’s attacks on the program, calling it “unlawful,” while the courts eventually struck this down. The program remains operational. \n\nThe program’s early results include decreases in vehicular traffic and car-related crashes and injuries, with increases in pedestrian traffic, business activity, and transit ridership in the district. With lowered vehicle volumes on some corridors, the DOT has also been able to redesign and reconfigure streets to install permanent and protected bicycle infrastructure, making it possible to expand their bike network. Getting cars of the road is a good thing.\n\nRevenue from congestion pricing has also funded complementary innovative programs like small business incentives to shift their delivery schedules to off-peak hours for reducing daytime traffic while also investing in public health prevention and case management programs to address childhood asthma in boroughs with populations most adversely impacted by health inequities and air pollution."
  - "I’m a big fan of Central City in Motion’s NW/SW Broadway Bike Lanes. PBOT has transformed a high-crash corridor to become a safer, more comfortable parking-protected bike lane for people biking south through the Pearl District through Downtown and to PSU. More recently, PBOT and Parks have added streetscaping to enhance the design with planters between the parked cars and the bike lane.\n\nWhat makes the Broadway Bike Lanes especially worth celebrating today is its history, which includes the successful efforts from bike advocates and local independent journalism from Bike Portland to create pressure on City officials to back off from removing the bike lanes. This episode showed us all that our modal plans for biking and walking need to be implemented and defended, and transparency matters when it comes to dealings between then commissioners, bureau leadership, and influential actors like the business lobby and hotel owners who have played a role in demanding the removal of valuable infrastructure that’s been planned or constructed. City Council has a role to play when it comes to conducting oversight on these matters and to ensure the funding and implementation of plans we’ve adopted, instead of going backwards on them. We can’t compromise safety and our vision for sustainability and a bikeable and walkable city just because some business interests want a few more street parking spaces or convenience. In this new form of government, we’re still in a transition period where old processes and power structures co-exist with new dynamics among constituents, councilors, bureaus, and the administration. We got a taste of how power operates when our northwest traffic diverters were facing removal until advocates and my office worked together to create urgency for saving them and questioned the reason for their removal and the cost of removal. \n\nOn the other hand, it’s disappointing to see how the State has handled the Rose Quarter I-5 Improvement Project. I don’t need to say much on this one. From the outrageous project cost escalation to ignoring expert research and cases from across the country for poor results from freeway expansions (e.g., induced demand), the Rose Quarter project shows how transportation officials and elected leaders have completely lost the plot. Megaprojects are not the way. We need to invest in a just transition now, and we could still support the local and regional economy with transit and active transportation projects."
  - Portland is making progress for active transportation and safety, but we can still do more, and we can’t get too comfortable with these incremental wins in some areas. We’re still seeing East Portland and SW Portland disproportionately impacted by traffic crashes, injuries and deaths and poor infrastructure like missing sidewalks and high-speed roads with dangerous intersections. We’re making progress with new revenue streams but still need to address fairness instead of regressiveness with the Transportation Utility Fee. The state legislature failed to pass a comprehensive transportation package to address even the most basic maintenance and operations needs and failed to stabilize our transit system in the Portland Metro area. We can’t celebrate progress until the legislature prioritizes walking, biking and transit instead of megaprojects and freeway expansions. I’m raising this issue at every chance I get, and submitted these items as my top priorities for Salem to work on for Portland. We also have to protect the Portland Clean Energy Fund from being raided for the Moda Center renovations, for police, or other uses that are not even remotely aligned with the voters intent for PCEF.
  - I’m a transit user and someone who bikes whenever I can. Working at City Hall along the transit mall makes it easier to catch connections by bus or train, but service in my neighborhood in deep southwest has been unreliable since the massive cuts in August. My household is “car light” and we can do better. My team in City Hall and I frequently use a mix of Biketown, scooters, and buses to our district activities. Lately, it’s been hard to have back-to-back appointments around town exclusively on bikes or transit because I have to haul things or offer rides to people. The schedule can be unforgiving with little flexibility. For a Week Without Driving, it’s easy to see how transit cuts for people who are transit-dependent are threatening people’s stability and reliability to get to work and keep their jobs or keep medical appointments. More elected officials need to experience transit on a regular basis.
- name: Josh Leake
  slug: josh-leake
  office: Council - District 4
  answers:
  - Amsterdam. It's a walkable city, but it's also accessible for people with disabilities. They prioritize public transit, bike, walking and car pooling. I believe we should prioritize public transit and use PCEF to help fund free public transit for all Portlanders. Once that is implemented, I would advocate for neighboring cities to create city connection transportation systems that lower the cost and make it more affordable to travel around our region. I also would advocate for reduction in costs to carry, transport and bring your bike when you travel.
  - "Portland Got Right: Bike lanes on the bridges going from Oregon to Washington on I5 and I205. \n\nPortland Got Wrong:Tilikum Crossing Bridge. I've been disappointed by the relatively small footprint for people and bikes. I wish that the project team had included more space for benches, and bike parking to enjoy the view."
  - "We need to create more walking or bike only community spaces and increase the requirement of bike parking inside and outside of new construction and high value remodeling.\n\nI would work more closely with banks in Oregon and request that they create a non-credit banking product to fund more bike, safety, and riding equipment purchases. Getting a bike, is just part of the issue. Bikers need helmets, bags, lights and pumps for safety and maintenance. \n\nI would also advocate for the parks bureau to address biking activities and create a city map of bike paths."
  - I walk and ride my bike. I also drive a hybrid Prius. I would walk or ride my bike to city hall. I drive and walk to grocery shop. I buy potatoes in bulk, so it's not convenient to have a 50lb bag of potatoes on my handlebar. Nothing is stopping me from riding my bike. Let's go!
- name: John McDonald
  slug: john-mcdonald
  office: Council - District 4
  answers:
  - "Vancouver, British Columbia, Canada. \nMore water taxis, turning streets into pedestrian only walkways for special events, designated scooter stations, light rail with fully grade-separated tracks and gates on all stations."
  - The Tilikum Bridge was a big win. It is a prime example of the city's commitment to all forms of movement. Failing to modernize Burnside Street on the westside (proper road resurfacing that goes beyond merely filling potholes, ADA sidewalk and crosswalk access, lane re-evaluations) is a missed opportunity.
  - It's getting better. Closing some of the Max stations downtown helps get people walking more. Promoting the Springwater Corridor is always a good idea. Keeping bike paths clear of homeless camps is very important.
  - I live in a one car household. I use public transit for most of my trips and walk and bicycle a lot. Portland's transit system was a major factor in choosing to live here.
- name: Matt Schulte
  slug: matt-schulte
  office: Council - District 4
  answers:
  - I'll admit that for the questions here I did not have answers at the ready. I needed to do some research, which was fun, actually. My understanding, now, is that Paris, starting in 2015, decided what kind of transit-oriented city they wanted to have and began a major expansion of protected bike routes, and then, in 2020, began a large-scale rollout of a schools streets project. This resulted in 300 pedestrianized streets around schools by September 2025. This thinking - decide what kind of city you want first, then decide what that'll take, is my approach. Everything is connected. One of my goals as a councilor will be to complete the Safe Routes priority network around every District 4 elementary school within one Council term.
  - |-
    Success: SW Capitol Highway. Again, after I did a little research, the SW Capitol Highway project seems like a success. Took a road with no sidewalks or bike paths/lanes and then built a pretty extraordinary system of sidewalks, protected bike lanes, multi-use paths, etc., and also looks like crossings, water infrastructure, fire hydrants and stormwater improvements. This is a whole-systems approach, which is the approach I try to take with everything I do. Everything connects!

    Not a success: The Southwest Corridor project. The 2020 regional tax package failed, and the proposed MAX line was attached to it, along with 150 or so other projects. Six years later, TriMet kept the federal eligibility, and has it in a new long-range vision plan, so the project hasn’t disappeared, but it seems like attaching it to such a huge package, with no Plan B, was a strategic error.
  - Based on the data I can find, there seems to be progress made on safety as measured by traffic and pedestrian deaths, but bicycle counts have been flat for a few years. Of course, that is just documentation of a trajectory, not an explanation. I would want to find out what is preventing non-bikers from taking it up, and if regular bikers are reducing their trips, why.
  - Two years ago, when I moved downtown, I got rid of my car, and am now 100% transit, for everything. I walk a LOT, and otherwise use the Max and TriMet. Yesterday I took the bus from downtown to the 26th and Clinton area to meet friends.
- name: Jeremy Beausoleil Smith
  slug: jeremy-beausoleil-smith
  office: Council - District 4
  answers:
  - "I’d say two: Washington, D.C. and Copenhagen, but for different reasons.\n\nWhen I worked on the Silver Line metro extension project in D.C., I really came to appreciate their public transportation system. More than 20% of D.C. residents use public transit to get to work, compared to under 4% nationally. It works because it’s accessible, fast, comprehensive, and extremely convenient. In most cases, the best option is to take the metro, so why drive?\n\nWhen I visited Copenhagen, I saw the same idea applied to biking. The city feels designed around biking, so the infrastructure and connections make it really easy and safe to get around that way. Portland is pretty good in this area for an American city, but traveling to Europe makes it apparent there is a lot more we can do. \n\nSome of those improvements would take significant funding and time, but there are also smaller changes we can make now. One funding source I want to explore is a mileage-based charge on large commercial delivery companies, so some of the money generated by all those delivery trips goes back into improving the transportation system they rely on."
  - |-
    I love Portland’s neighborhood greenways. They’re one of those things I notice and appreciate all the time when I’m biking around the city. They make cycling safer and more accessible for me and my family, but also for everyday commuters who don’t want to spend their morning dodging cars. I feel similarly about Tilikum Crossing. It’s a really intelligently designed bridge that makes crossing the Willamette without a car surprisingly stress-free.

    For what Portland got wrong, I think about all the streetcar infrastructure we used to have through the mid-20th century. A lot of people, even lifelong Portlanders, don’t know about the old streetcars until a construction crew digs up tracks that were paved over decades ago. Looking at maps of the historic lines is honestly impressive; they connected neighborhoods across every part of Portland and shaped the way much of the city looks even today. They were privately owned, so as cars took over, the system disappeared and most of the infrastructure was buried. If Portland had gone in the other direction and municipalized the system instead, we could’ve had a much stronger foundation for public transit than what we have today.
  - "I think Portland is absolutely making progress, especially when it comes to safety and accessibility, even if we still have a long way to go.\n\nIn addition to the greenways, I really like the city’s protected bike lanes and sidewalk bump-outs that make travel safer. Safe Routes to School is another program I’m very supportive of, because parents should always feel comfortable letting their children bike or walk to school. It’s good to get kids used to healthy, safe, and emission-free transportation, because those habits can last a lifetime. I also support Vision Zero and its focus on making our most dangerous streets safer. \n\nA lot of this progress comes from sustained public pressure on the local government. We still have major gaps in sidewalks and safe crossings, especially in East Portland, and those neighborhoods deserve the same level of investment. The next step is making sure that progress reaches every part of the city, and I think it’s City Council’s job to listen to the people who use these streets every day and respond to what they need."
  - "We’re a one-car household, so when I’m not using that, I’m usually biking, walking, or taking transit. I bike most days. My most recent transit trip was taking the Yellow Line from North Portland into downtown.\n\nI think most people are constantly doing a little calculation in their head about time, cost, and convenience when it comes to transit. For me, and for lots of people, driving often wins. If we want more people to take alternate forms of transportation, we have to change that equation. Transit needs to be faster, more reliable, and easier to use. It also needs to be more comprehensive. A lot of our system is still designed around getting people in and out of downtown, but Portlanders need to get between neighborhoods too. \n\nIf we can tip the balance of that equation so driving is no longer automatically the best option, we can move toward a city where everyday life is built around walking, biking, and taking public transit."
