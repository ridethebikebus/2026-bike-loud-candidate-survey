<div class="rating" data-candidate="{{ include.candidate }}" data-question="{{ include.question }}">
  <span class="rating-label">Your rating</span>
  <span class="rating-stars" role="group" aria-label="Rate this answer from 1 to 5 stars">
    {%- for n in (1..5) -%}
      <button type="button" data-stars="{{ n }}" aria-pressed="false" aria-label="{{ n }} star{% if n > 1 %}s{% endif %}">★</button>
    {%- endfor -%}
  </span>
</div>
